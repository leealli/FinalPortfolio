<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

<title>Allison Lee | Contact Me</title>
<meta name="description" content="Portfolio of Allison Lee, a graphic and visual designer specializing in branding, logos, and illustrations.">
<meta name="keywords" content="graphic design, portfolio, Allison Lee, visual design, branding, contact">
<meta name="author" content="Allison Lee">

<style>
    	@font-face {
    } body {
        background-color: #F2E9E4;
    } #page {
        width: 1050px;
        height: 1224px;
        background: white;
        margin: 0 auto;
        padding: 48px;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
    } h1 {
        font: 30pt/1.0em 'Playfair Display';
		font-weight: 500;
        text-align: center;
		margin-bottom: 15px;
	} h2 {
        font: 20pt/1.0em 'Playfair Display';
		font-weight: 400;
        text-align: center;
		margin-bottom: 50px;
    } p {
		text-align: center;
		margin-top: 30px;
		font: 12pt/1.4em 'Lexend'
	} .intro {
		text-align: center;
		margin-left: 70px;
		margin-right: 70px;
		padding-bottom: 20px;
	} .navbar {
  		display: flex;
		justify-content: center;
  		gap: 7px;
  		padding-top: 10px;
		padding-left: 10px;
		padding-bottom: 100px;
	} button {
		background: #F2E9E4;
		display: block;
		margin-left: auto;
		margin-right: 30px;
		padding: 10px 18px;
  		border-radius: 20px;
  		font: 8pt/1.0em 'Lexend';
		color: black;
  		transition: transform 0.2s ease, background 0.2s ease;
	} .herobutton {
		background: #C9ADA7;
		display: inline-block;
		width: fit-content;
  		margin: 0 auto;
  		padding: 7px 14px;
  		border-radius: 300px;
 		text-decoration: none;
		display: flex;
		font: 11pt/1.0em 'Lexend';
		color: black;
  		font-weight: 400;
  		transition: 0.3s;
	} .herobutton:hover {
  		transform: scale(1.05);
	} .dark-mode {
  		background-color: #22223B;
  		color: white;
	} body.dark-mode #page {
  		background-color: #4A4E69;
  		color: white;
		border: none;
		box-shadow: 2px 3px 6px black;
	} .nav-btn {
  		text-decoration: none;
		margin-left: 20px;
  		padding: 10px 18px;
  		border-radius: 20px;
  		background: #F2E9E4;
  		color: black;
  		font: 12pt/1.0em 'Lexend';
  		font-size: 14px;
  		transition: transform 0.2s ease, background 0.2s ease;
	} .nav-btn:hover {
  		background: #E3D5CF;
  		transform: scale(1.05);
	} .contact-container {
    	width: 500px;
    	margin: 60px auto;
	} .contact-form {
    	display: flex;
    	flex-direction: column;
    	gap: 20px;
	} .contact-form input,
	  .contact-form textarea {
    	padding: 15px;
    	border: 1.5px solid #333;
    	border-radius: 14px;
    	background-color: #F2E9E4;
    	font-family: 'Lexend';
    	font-size: 14px;
    	resize: none;
	} .contact-form button {
    	width: fit-content;
    	padding: 10px 20px;
    	border: 1.5px solid #333;
    	border-radius: 999px;
    	background-color: #C9ADA7;
    	font-family: 'Lexend';
    	font-size: 14px;
    	cursor: pointer;
    	transition: 0.3s ease;
	} .contact-form button:hover {
    	transform: scale(1.05);
	}
</style>
</head>

<body>
<div id="page">
<nav class="navbar">
  <a href="index.html" class="nav-btn">Home</a>
  <a href="portfolioworks.html" class="nav-btn">Works</a>
  <a href="aboutme.html" class="nav-btn">About</a>
  <a href="clientreviews.html" class="nav-btn">Testimonials</a>
  <a href="contact.html" class="nav-btn">Contact</a>
<button onclick="toggleDark()">Toggle Dark Mode</button>
</nav>
	
<h1>Let's get in touch</h1>
<p>Have a project, idea, or opportunity in mind? I would love to work together.</p>
	
	<div class="contact-container">

    <form class="contact-form">

        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <textarea placeholder="Your Message" rows="6" required></textarea>

        <button type="submit">Send Message</button>

    </form>

</div>
</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark-mode");
}
</script>
	
</body>
</html>
